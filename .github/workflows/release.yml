name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test CYD relay API
        run: python3 -B -m unittest relay.test_relay -v

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath gradle.properties -Pattern '^version\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match Gradle version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, lint and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean build :patches:buildAndroid

      - name: Prepare release assets and notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundles = @(Get-ChildItem patches/build/libs/patches-*.rvp | Where-Object { $_.Name -notmatch '(sources|javadoc)' })
          if ($bundles.Count -ne 1) { throw "Expected one release RVP, found $($bundles.Count)" }
          $bundle = $bundles[0]
          ./scripts/verify-android-rvp.ps1 -Path $bundle.FullName
          Copy-Item -LiteralPath $bundle.FullName -Destination dist/povo-2.0-patches.rvp
          git archive --format=zip --output=dist/povo-cyd-relay.zip HEAD relay LICENSE
          if ($LASTEXITCODE -ne 0) { throw "Relay archive failed" }
          ./scripts/generate-patches-json.ps1 -Version '${{ steps.version.outputs.version }}' -OutputPath dist/patches.json
          ./scripts/extract-changelog.ps1 -Version '${{ steps.version.outputs.version }}' -OutputPath dist/release-notes.md

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/povo-2.0-patches.rvp
            dist/patches.json
            dist/povo-cyd-relay.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          dist/povo-2.0-patches.rvp
          dist/patches.json
          dist/povo-cyd-relay.zip
          --verify-tag
          --title "v${{ steps.version.outputs.version }}"
          --notes-file dist/release-notes.md
