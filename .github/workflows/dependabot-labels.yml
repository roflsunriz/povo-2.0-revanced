name: Maintain Dependabot labels

on:
  push:
    branches: [main]
    paths:
      - .github/dependabot.yml
      - .github/dependabot.yaml
      - .github/workflows/dependabot-labels.yml
      - .github/tests/test-dependabot-labels.py
      - bun.lock
      - .bun-version
      - package.json
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/dependabot.yaml
      - .github/workflows/dependabot-labels.yml
      - .github/tests/test-dependabot-labels.py
      - bun.lock
      - .bun-version
      - package.json
  label:
    types: [deleted, edited]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-labels-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout for read-only regression tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install YAML reader
        run: python -m pip install PyYAML==6.0.3
      - name: Test label maintenance and lockfile compatibility
        run: python .github/tests/test-dependabot-labels.py

  labels:
    needs: verify
    if: github.repository_owner == 'roflsunriz' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install YAML reader
        run: python -m pip install PyYAML==6.0.3
      - name: Create only missing labels referenced by the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          import yaml

          root = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]

          def api(path, payload=None):
              request = urllib.request.Request(
                  root + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def existing_labels():
              found = set()
              page = 1
              while True:
                  labels = api(f"/labels?per_page=100&page={page}")
                  found.update(label["name"].casefold() for label in labels if not label.get("archived_at"))
                  if len(labels) < 100:
                      return found
                  page += 1

          files = api("/contents/.github")
          paths = [file["path"] for file in files if file["name"] in ("dependabot.yml", "dependabot.yaml")]
          if len(paths) != 1:
              raise RuntimeError("Expected exactly one Dependabot configuration")
          file = api("/contents/" + paths[0])
          config = yaml.safe_load(base64.b64decode(file["content"]))
          required = set()
          entries = config.get("updates", []) + list(config.get("multi-ecosystem-groups", {}).values())
          for entry in entries:
              labels = entry.get("labels", [])
              if not isinstance(labels, list) or any(not isinstance(label, str) or not label for label in labels):
                  raise RuntimeError("Dependabot labels must be a list of nonempty strings")
              required.update(labels)

          metadata = {
              "dependencies": ("0366d6", "Pull requests that update a dependency file"),
              "github-actions": ("2088FF", "GitHub Actions dependencies and workflows"),
          }
          present = existing_labels()
          for name in sorted(required):
              if name.casefold() in present:
                  continue
              color, description = metadata.get(name.casefold(), ("ededed", "Referenced by Dependabot configuration"))
              try:
                  api("/labels", {"name": name, "color": color, "description": description})
              except urllib.error.HTTPError as error:
                  if error.code != 422 or name.casefold() not in existing_labels():
                      raise
              print("Ensured label: " + name)
          present = existing_labels()
          missing = [name for name in required if name.casefold() not in present]
          if missing:
              raise RuntimeError("Required labels are still missing: " + ", ".join(sorted(missing)))
          print("All configured Dependabot labels exist; existing labels were preserved.")
